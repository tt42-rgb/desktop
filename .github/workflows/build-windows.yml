name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main, build/windows-executable]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'desktop_organizer/**'
      - 'main.py'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/windows-readme.txt'
      - 'requirements-build.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Test, package and check the executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload ready-to-run Windows version
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DesktopOrganizer-Windows-x64
          path: build/windows-release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
