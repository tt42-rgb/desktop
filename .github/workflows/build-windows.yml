name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main, build/windows-executable]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'desktop_organizer/**'
      - 'main.py'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/windows-readme.txt'
      - 'requirements-build.txt'
      - 'windows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'
      - name: Test, package and check the executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload ready-to-run Windows version
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DesktopFences-Windows-x64
          path: build/windows-release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
